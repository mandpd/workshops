<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #06070d;
            --bg-card: #10131d;
            --bg-chip: #171a25;
            --text-primary: #ececf0;
            --text-secondary: #a8aab3;
            --text-dim: #636773;
            --accent: #f59e0b;
            --accent-hover: #fbbf24;
            --accent-dim: rgba(245, 158, 11, 0.18);
            --accent-border: rgba(245, 158, 11, 0.45);
            --border: rgba(255,255,255,0.06);
            --border-light: rgba(255,255,255,0.12);
            --font-sans: 'Barlow', system-ui, -apple-system, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-weight: 400;
            letter-spacing: 0.005em;
            -webkit-font-smoothing: antialiased;
        }
        .index-wrapper { text-align: center; max-width: 900px; padding: 2rem; }
        h1 { font-size: 2.5rem; font-weight: 500; margin-bottom: 0.5rem; letter-spacing: -0.015em; }
        .subtitle { color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 2.5rem; font-weight: 300; }
        .deck-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
            text-align: left;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem;
            text-decoration: none;
            transition: border-color 0.15s, transform 0.15s, background 0.15s;
        }
        .card:hover {
            border-color: var(--accent-border);
            background: var(--bg-chip);
            transform: translateY(-2px);
        }
        .card h4 { color: var(--text-primary); font-size: 1.05rem; font-weight: 500; margin-bottom: 0.5rem; }
        .card p { color: var(--text-secondary); font-size: 0.9rem; font-weight: 400; }
    </style>
</head>
<body>
    <div class="index-wrapper">
        <h1>Presentations</h1>
        <p class="subtitle">Presentation hub</p>
        <div class="deck-grid">
        <a href="decks/coding-with-agents/dist/index.html" class="card"><h4>Coding with Agents</h4><p>17 slides</p></a>
        </div>
    </div>
</body>
</html>
