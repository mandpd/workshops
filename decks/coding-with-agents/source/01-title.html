<!DOCTYPE html>
<html lang="en">
<head>
<!-- partial:head -->
    <style>
        /* ===== Title slide ===== */
        .title-section {
            min-height: calc(100vh - var(--topnav-height) - var(--footer-height));
            align-items: center;
            text-align: center;
        }

        /* Wrapper shrinks to the title's width so the rule + subtitle
           can align to the same visual edge. */
        .title-block {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
        }

        .title-h1 {
            font-size: 5.25rem;
            font-weight: 500;
            line-height: 1.02;
            letter-spacing: -0.025em;
            margin: 0 0 1.25rem 0;
            white-space: nowrap;
        }

        /* Amber rule stretches to match the title width (inherits from .title-block) */
        .title-rule {
            width: 100%;
            height: 2px;
            background: var(--accent);
            border-radius: 1px;
            margin: 0 0 1.5rem 0;
        }

        .title-subtitle {
            font-size: 1.6rem;
            font-weight: 300;
            line-height: 1.4;
            color: var(--text-secondary);
            margin: 0;
            letter-spacing: 0.002em;
        }

        @media (max-width: 768px) {
            .title-h1       { font-size: 3rem; white-space: normal; }
            .title-subtitle { font-size: 1.15rem; }
        }
    </style>
</head>
<body>

<!-- partial:topnav -->

<div class="page">
    <main class="main">

        <section class="section title-section" id="title">
            <div class="title-block">
                <h1 class="title-h1">Anatomy of an Agent</h1>
                <div class="title-rule"></div>
                <p class="title-subtitle">An opinionated look at coding with TUI agents.</p>
            </div>
        </section>

    </main>
</div>

<!-- partial:scripts -->
<!-- partial:keynav -->

</body>
</html>
